```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tone Quest</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(#1e3c72, #2a5298);
    color: white;
    text-align: center;
    margin: 0;
}

#game {
    padding: 20px;
}

h1 {
    margin-top: 10px;
}

.status {
    display: flex;
    justify-content: space-between;
    padding: 10px 40px;
    font-size: 20px;
}

#monster {
    font-size: 80px;
    margin: 20px;
    transition: transform 0.3s;
}

.hit {
    transform: scale(1.3);
}

button {
    font-size: 20px;
    padding: 15px;
    margin: 10px;
    width: 200px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #ffd700;
    color: black;
}

#feedback {
    font-size: 24px;
    margin: 15px;
}

#nextBtn {
    display: none;
    background: limegreen;
}

#result {
    display: none;
    font-size: 28px;
    margin-top: 20px;
}
</style>
</head>

<body>
<div id="game">

<h1>🎮 Tone Quest</h1>

<div class="status">
    <div>❤️ HP: <span id="hp">3</span></div>
    <div>🎯 Score: <span id="score">0</span></div>
</div>

<div id="monster">👾</div>

<button onclick="playSound()">🔊 播放聲音</button>

<div id="choices"></div>

<div id="feedback"></div>

<button id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>

<div id="result"></div>

</div>

<script>
const questions = [
    {tone:"mā", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"媽 mā"},
    {tone:"má", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"麻 má"},
    {tone:"mǎ", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"馬 mǎ"},
    {tone:"mà", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"罵 mà"},
    {tone:"mā", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"媽 mā"},
    {tone:"má", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"麻 má"},
    {tone:"mǎ", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"馬 mǎ"},
    {tone:"mà", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"罵 mà"},
    {tone:"mǎ", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"馬 mǎ"},
    {tone:"má", options:["媽 mā","麻 má","馬 mǎ","罵 mà"], answer:"麻 má"}
];

let current = 0;
let score = 0;
let hp = 3;

function loadQuestion(){
    document.getElementById("feedback").innerText = "";
    document.getElementById("nextBtn").style.display = "none";

    let q = questions[current];
    let choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";

    q.options.forEach(opt => {
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt);
        choicesDiv.appendChild(btn);
    });
}

function playSound(){
    let utterance = new SpeechSynthesisUtterance(questions[current].tone);
    utterance.lang = "zh-TW";
    speechSynthesis.speak(utterance);
}

function checkAnswer(choice){
    let correct = questions[current].answer;
    let monster = document.getElementById("monster");

    if(choice === correct){
        score += 10;
        document.getElementById("feedback").innerText = "💥 正確！攻擊成功！";
        monster.classList.add("hit");
    } else {
        hp -= 1;
        document.getElementById("feedback").innerText = "⚡ 錯誤！你被攻擊了！";
    }

    document.getElementById("score").innerText = score;
    document.getElementById("hp").innerText = hp;

    setTimeout(()=>monster.classList.remove("hit"),300);

    document.getElementById("nextBtn").style.display = "inline-block";

    if(hp <= 0){
        endGame();
    }
}

function nextQuestion(){
    current++;
    if(current < questions.length){
        loadQuestion();
    } else {
        endGame();
    }
}

function endGame(){
    document.getElementById("choices").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    let result = "";
    if(score >= 90) result = "🎯 Tone Master";
    else if(score >= 70) result = "👍 Tone Explorer";
    else if(score >= 50) result = "🙂 Getting There";
    else result = "🧩 Keep Practicing";

    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerText = 
        `遊戲結束！你的分數：${score}\n${result}`;
}

loadQuestion();
</script>

</body>
</html>
```

```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tone Quest FIXED</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(#141e30, #243b55);
    color: white;
    text-align: center;
}

.status {
    display: flex;
    justify-content: space-around;
    font-size: 20px;
}

button {
    font-size: 20px;
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    cursor: pointer;
}

#feedback {
    font-size: 24px;
    margin: 10px;
}
</style>
</head>

<body>

<h1>🎮 Tone Quest</h1>

<div class="status">
❤️ HP: <span id="hp">3</span>
🎯 Score: <span id="score">0</span>
</div>

<div style="font-size:70px;">👾</div>

<button onclick="playAudio()">🔊 播放聲音</button>

<div id="choices"></div>

<div id="feedback"></div>

<button id="nextBtn" onclick="nextQuestion()" style="display:none;">下一題</button>

<div id="result"></div>

<script>
/* ✅ 使用真正可用的音源（Google Translate TTS） */
function getAudioURL(text){
    return `https://translate.google.com/translate_tts?ie=UTF-8&q=${text}&tl=zh-TW&client=tw-ob`;
}

const questions = [
    {sound:"媽", answer:"媽 mā"},
    {sound:"麻", answer:"麻 má"},
    {sound:"馬", answer:"馬 mǎ"},
    {sound:"罵", answer:"罵 mà"},
    {sound:"媽", answer:"媽 mā"},
    {sound:"麻", answer:"麻 má"},
    {sound:"馬", answer:"馬 mǎ"},
    {sound:"罵", answer:"罵 mà"},
    {sound:"馬", answer:"馬 mǎ"},
    {sound:"麻", answer:"麻 má"}
];

const options = ["媽 mā","麻 má","馬 mǎ","罵 mà"];

let current = 0;
let score = 0;
let hp = 3;

function loadQuestion(){
    document.getElementById("feedback").innerText = "";
    document.getElementById("nextBtn").style.display = "none";

    let div = document.getElementById("choices");
    div.innerHTML = "";

    options.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = ()=>checkAnswer(opt);
        div.appendChild(btn);
    });
}

function playAudio(){
    let text = questions[current].sound;
    let audio = new Audio(getAudioURL(text));

    audio.play().catch(err=>{
        alert("⚠️ 無法播放音檔（可能被瀏覽器阻擋）");
        console.log(err);
    });
}

function checkAnswer(choice){
    let correct = questions[current].answer;

    if(choice === correct){
        score += 10;
        document.getElementById("feedback").innerText = "💥 正確！";
    } else {
        hp -= 1;
        document.getElementById("feedback").innerText = "⚡ 錯誤！";
    }

    document.getElementById("score").innerText = score;
    document.getElementById("hp").innerText = hp;

    document.getElementById("nextBtn").style.display = "inline-block";

    if(hp <= 0) endGame();
}

function nextQuestion(){
    current++;
    if(current < questions.length){
        loadQuestion();
    } else {
        endGame();
    }
}

function endGame(){
    document.getElementById("choices").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    let result = score >= 90 ? "🎯 Tone Master" :
                 score >= 70 ? "👍 Tone Explorer" :
                 score >= 50 ? "🙂 Getting There" :
                               "🧩 Keep Practicing";

    document.getElementById("result").innerText =
        `分數：${score}\n${result}`;
}

loadQuestion();
</script>

</body>
</html>
```

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>🎮 Tone Quest</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(#141e30, #243b55);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.status {
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    margin: 10px;
}

#monster {
    font-size: 80px;
    margin: 20px;
}

button {
    font-size: 20px;
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

button:hover {
    background: gold;
    color: black;
}

#feedback {
    font-size: 24px;
    margin: 15px;
}

#nextBtn {
    display: none;
}

#result {
    font-size: 28px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>🎮 Tone Quest</h1>

<div class="status">
    ❤️ HP: <span id="hp">3</span>
    🎯 Score: <span id="score">0</span>
</div>

<div id="monster">👾</div>

<button onclick="playAudio()">🔊 播放聲音</button>

<div id="choices"></div>

<div id="feedback"></div>

<button id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>

<div id="result"></div>

<script>
/* 🔊 你的 GitHub Pages 音檔位置 */
const baseURL = "https://damuli.github.io/Mandarin_tone_assessment/";

const questions = [
    {audio:"ma1.m4a", answer:"媽 mā"},
    {audio:"ma2.m4a", answer:"麻 má"},
    {audio:"ma3.m4a", answer:"馬 mǎ"},
    {audio:"ma4.m4a", answer:"罵 mà"},
    {audio:"ma1.m4a", answer:"媽 mā"},
    {audio:"ma2.m4a", answer:"麻 má"},
    {audio:"ma3.m4a", answer:"馬 mǎ"},
    {audio:"ma4.m4a", answer:"罵 mà"},
    {audio:"ma3.m4a", answer:"馬 mǎ"},
    {audio:"ma2.m4a", answer:"麻 má"}
];

const options = ["媽 mā","麻 má","馬 mǎ","罵 mà"];

let current = 0;
let score = 0;
let hp = 3;

function loadQuestion(){
    document.getElementById("feedback").innerText = "";
    document.getElementById("nextBtn").style.display = "none";

    let div = document.getElementById("choices");
    div.innerHTML = "";

    options.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = ()=>checkAnswer(opt);
        div.appendChild(btn);
    });
}

function playAudio(){
    let file = questions[current].audio;
    let url = baseURL + file;

    console.log("播放：", url);

    let audio = new Audio(url);
    audio.play().catch(err=>{
        alert("❌ 播放失敗，請確認音檔網址是否正確");
        console.log(err);
    });
}

function checkAnswer(choice){
    let correct = questions[current].answer;

    if(choice === correct){
        score += 10;
        document.getElementById("feedback").innerText = "💥 正確！攻擊成功！";
    } else {
        hp -= 1;
        document.getElementById("feedback").innerText = "⚡ 錯誤！被攻擊！";
    }

    document.getElementById("score").innerText = score;
    document.getElementById("hp").innerText = hp;

    document.getElementById("nextBtn").style.display = "inline-block";

    if(hp <= 0){
        endGame();
    }
}

function nextQuestion(){
    current++;
    if(current < questions.length){
        loadQuestion();
    } else {
        endGame();
    }
}

function endGame(){
    document.getElementById("choices").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    let result = score >= 90 ? "🎯 Tone Master" :
                 score >= 70 ? "👍 Tone Explorer" :
                 score >= 50 ? "🙂 Getting There" :
                               "🧩 Keep Practicing";

    document.getElementById("result").innerText =
        `遊戲結束！分數：${score}\n${result}`;
}

loadQuestion();
</script>

</body>
</html>

html id="tonequest_simple"
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>🎮 Tone Quest（四聲版）</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(#141e30, #243b55);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.status {
    font-size: 20px;
    margin: 10px;
}

button {
    font-size: 20px;
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

button:hover {
    background: gold;
    color: black;
}

#feedback {
    font-size: 24px;
    margin: 15px;
}

#nextBtn {
    display: none;
}

#result {
    font-size: 28px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>🎮 四聲聽辨挑戰</h1>

<div class="status">
    🎯 Score: <span id="score">0</span> / 100
</div>

<!-- 播放 -->
<button onclick="playAudio()">🔊 播放聲音</button>

<audio id="player"></audio>

<div id="choices"></div>

<div id="feedback"></div>

<button id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>

<div id="result"></div>

<script>
const baseURL = "https://damuli.github.io/Mandarin_tone_assessment/";

/* 🎯 四題固定（剛好四聲） */
const questions = [
    {audio:"ma1.m4a", answer:"媽 mā"},
    {audio:"ma2.m4a", answer:"麻 má"},
    {audio:"ma3.m4a", answer:"馬 mǎ"},
    {audio:"ma4.m4a", answer:"罵 mà"}
];

const options = ["媽 mā","麻 má","馬 mǎ","罵 mà"];

let current = 0;
let score = 0;

function loadQuestion(){
    document.getElementById("feedback").innerText = "";
    document.getElementById("nextBtn").style.display = "none";

    let div = document.getElementById("choices");
    div.innerHTML = "";

    options.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = ()=>checkAnswer(opt);
        div.appendChild(btn);
    });
}

function playAudio(){
    let file = questions[current].audio;
    let url = baseURL + file;

    let player = document.getElementById("player");
    player.src = url;
    player.currentTime = 0;

    player.play().catch(err=>{
        alert("❌ 請先點擊畫面再播放");
    });
}

function checkAnswer(choice){
    let correct = questions[current].answer;

    if(choice === correct){
        score += 25;
        document.getElementById("feedback").innerText = "✅ 正確！";
    } else {
        document.getElementById("feedback").innerText = "❌ 錯誤！";
    }

    document.getElementById("score").innerText = score;
    document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion(){
    current++;
    if(current < questions.length){
        loadQuestion();
    } else {
        endGame();
    }
}

function endGame(){
    document.getElementById("choices").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    let result = "";

    if(score === 100) result = "🎯 完美！四聲全對";
    else if(score >= 75) result = "👍 很好！再加強一點";
    else if(score >= 50) result = "🙂 還可以，再練習";
    else result = "🧩 建議重練一次";

    document.getElementById("result").innerText =
        `你的分數：${score} / 100\n${result}`;
}

loadQuestion();
</script>

</body>
</html>

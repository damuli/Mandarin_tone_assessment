<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Tone Quest</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(#141e30, #243b55);
    color: white;
    text-align: center;
}

.status {
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    margin: 15px;
}

#monster {
    font-size: 80px;
    margin: 20px;
}

button {
    font-size: 20px;
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

button:hover {
    background: gold;
    color: black;
}

#feedback {
    font-size: 24px;
    margin: 10px;
}

#nextBtn {
    display: none;
}

#result {
    display: none;
    font-size: 28px;
}
</style>
</head>

<body>

<h1>🎮 Tone Quest</h1>

<div class="status">
    ❤️ HP: <span id="hp">3</span>
    🎯 Score: <span id="score">0</span>
</div>

<div id="monster">👾</div>

<button onclick="playAudio()">🔊 播放聲音</button>

<div id="choices"></div>

<div id="feedback"></div>

<button id="nextBtn" onclick="nextQuestion()">下一題 ➡️</button>

<div id="result"></div>

<!-- 音檔 -->
<audio id="audio_ma1" src="https://cdn.jsdelivr.net/gh/terkelg/awesome-creative-coding-assets/audio/ma1.mp3"></audio>
<audio id="audio_ma2" src="https://cdn.jsdelivr.net/gh/terkelg/awesome-creative-coding-assets/audio/ma2.mp3"></audio>
<audio id="audio_ma3" src="https://cdn.jsdelivr.net/gh/terkelg/awesome-creative-coding-assets/audio/ma3.mp3"></audio>
<audio id="audio_ma4" src="https://cdn.jsdelivr.net/gh/terkelg/awesome-creative-coding-assets/audio/ma4.mp3"></audio>

<script>
const questions = [
    {audio:"audio_ma1", answer:"媽 mā"},
    {audio:"audio_ma2", answer:"麻 má"},
    {audio:"audio_ma3", answer:"馬 mǎ"},
    {audio:"audio_ma4", answer:"罵 mà"},
    {audio:"audio_ma1", answer:"媽 mā"},
    {audio:"audio_ma2", answer:"麻 má"},
    {audio:"audio_ma3", answer:"馬 mǎ"},
    {audio:"audio_ma4", answer:"罵 mà"},
    {audio:"audio_ma3", answer:"馬 mǎ"},
    {audio:"audio_ma2", answer:"麻 má"}
];

const options = ["媽 mā","麻 má","馬 mǎ","罵 mà"];

let current = 0;
let score = 0;
let hp = 3;

function loadQuestion(){
    document.getElementById("feedback").innerText = "";
    document.getElementById("nextBtn").style.display = "none";

    let choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";

    options.forEach(opt=>{
        let btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = ()=>checkAnswer(opt);
        choicesDiv.appendChild(btn);
    });
}

function playAudio(){
    let audio = document.getElementById(questions[current].audio);
    audio.currentTime = 0;
    audio.play();
}

function checkAnswer(choice){
    let correct = questions[current].answer;

    if(choice === correct){
        score += 10;
        document.getElementById("feedback").innerText = "💥 正確！攻擊成功！";
    } else {
        hp -= 1;
        document.getElementById("feedback").innerText = "⚡ 錯誤！被怪物打中！";
    }

    document.getElementById("score").innerText = score;
    document.getElementById("hp").innerText = hp;

    document.getElementById("nextBtn").style.display = "inline-block";

    if(hp <= 0){
        endGame();
    }
}

function nextQuestion(){
    current++;
    if(current < questions.length){
        loadQuestion();
    } else {
        endGame();
    }
}

function endGame(){
    document.getElementById("choices").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";

    let resultText = "";

    if(score >= 90) resultText = "🎯 Tone Master";
    else if(score >= 70) resultText = "👍 Tone Explorer";
    else if(score >= 50) resultText = "🙂 Getting There";
    else resultText = "🧩 Keep Practicing";

    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerText =
        `遊戲結束！分數：${score}\n${resultText}`;
}

loadQuestion();
</script>

</body>
</html>
```
